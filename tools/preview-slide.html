<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Превью слайда</title>
<!-- Служебная страница для скриншотов (на сайт не выкладывается): открывает главную в рамке 1366 px,
     выключает анимацию и показывает слайд номер n. Пример для headless Edge:
     msedge --headless=new --window-size=1366,720 --virtual-time-budget=4000 --screenshot=s2.png
            "http://localhost:8765/tools/preview-slide.html?n=2"  (добавьте &w=390, чтобы увидеть телефон) -->
<style>html, body { margin: 0; overflow: hidden; } iframe { border: 0; display: block; }</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search), n = (+q.get('n') || 1) - 1, w = +q.get('w') || 1366;
  var f = document.createElement('iframe');
  f.style.width = w + 'px'; f.style.height = (+q.get('h') || 720) + 'px';
  // &p=uzi.html — открыть другую страницу (например, чтобы снять баннер страницы в размере телефона)
  // &hash=koliki — открыть страницу с якорем (например, раскрытая статья в «Полезном»)
  f.src = '../' + (q.get('p') || 'index.html') + '?preview=' + Date.now() + (q.get('hash') ? '#' + q.get('hash') : '');
  f.onload = function () {
    var d = f.contentDocument, s = d.createElement('style');
    s.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; }';
    d.head.appendChild(s);
    var slider = d.querySelector('.slider');
    if (!slider) return;
    slider.dispatchEvent(new Event('mouseenter'));
    d.querySelectorAll('.slide').forEach(function (el, k) { el.classList.toggle('is-active', k === n); });
    d.querySelectorAll('.slider__dot').forEach(function (el, k) { el.classList.toggle('is-active', k === n); });
    d.querySelectorAll('.slide img').forEach(function (img) { img.loading = 'eager'; });
  };
  document.body.appendChild(f);
</script>
</body>
</html>
